<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Uberversitários</title>
<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* VARIÁVEIS */
:root {
  --primary: #ff5a5f;
  --secondary: #ff7a18;
  --gradient: linear-gradient(135deg, #ff5a5f, #ff7a18);

  --bg: #ffffff;
  --text: #333;
  --text-light: #777;

  --radius: 20px;
}

/* BODY */
body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

/* BOLA GRADIENTE */
body::after {
  content: "";
  position: fixed;
  right: -200px;
  top: -200px;
  width: 600px;
  height: 600px;
  background: var(--gradient);
  border-radius: 50%;
  opacity: 0.9;
  z-index: -1;
}

/* LAYOUT PRINCIPAL */
.main {
  display: flex;
  min-height: 100vh;
}

/* LADOS */
.lado {
  flex: 1;
  padding: 60px;
}


/* TEXTOS */
h1 {
  margin-bottom: 20px;
}

p {
  margin-bottom: 10px;
  color: var(--text-light);
}

/* FORM */
form {
  display: flex;
  flex-direction: column;
}

input {
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

input:focus {
  border-color: var(--primary);
  outline: none;
}

/* BOTÃO */
button {
  padding: 12px;
  border: none;
  border-radius: 15px;
  background: var(--secondary);
  color: white;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  opacity: 0.9;
  transform: scale(1.05);
}
</style>

</head>
