<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uberversitários</title>
<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* VARIÁVEIS */
:root {
  --primary: #ff5a5f;
  --secondary: #ff7a18;
  --gradient: linear-gradient(135deg, #ff5a5f, #ff7a18);

  --bg: #ffffff;
  --text: #333;
  --text-light: #777;

  --radius: 20px;
}

/* BODY */
body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

/* BOLA GRADIENTE */
body::after {
  content: "";
  position: fixed;
  right: -200px;
  top: -200px;
  width: 600px;
  height: 600px;
  background: var(--gradient);
  border-radius: 50%;
  opacity: 0.9;
  z-index: -1;
}

/* LAYOUT PRINCIPAL */
.main {
  display: flex;
  min-height: 100vh;
}

/* LADOS */
.lado {
  flex: 1;
  padding: 60px;
}


/* TEXTOS */
h1 {
  margin-bottom: 20px;
}

p {
  margin-bottom: 10px;
  color: var(--text-light);
}

/* FORM */
form {
  display: flex;
  flex-direction: column;
}

input {
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

input:focus {
  border-color: var(--primary);
  outline: none;
}

/* BOTÃO */
button {
  padding: 12px;
  border: none;
  border-radius: 15px;
  background: var(--secondary);
  color: white;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  opacity: 0.9;
  transform: scale(1.05);
}
</style>

</head>

<body>

<div class="main">

    <!-- LADO ESQUERDO (CADASTRO) -->
    <div class="lado esquerda">

        <h1>Cadastro</h1>

        <form id="formCadastro">

            <input type="email" id="email" placeholder="Email" required>
            <p id="msgEmail"></p>

            <input type="password" id="senha" placeholder="Senha" required>
            <p id="msgSenha"></p>

            <input type="password" id="confirmarSenha" placeholder="Confirmar senha" required>
            <p id="msgConfirmar"></p>

            <button type="submit">Cadastrar</button>

        </form>

    </div>

    <!-- LADO DIREITO (MOTORISTA) -->
    <div class="lado direita">

        <h1>Motorista</h1>

        <p><strong>Nome do Motorista:</strong></p>
        <p><strong>Veículo:</strong></p>
        <p><strong>Contato:</strong></p>

        <h2>Rota</h2>

        <h3>Integrantes:</h3>

    </div>

</div>

<script>
    const form = document.getElementById("formCadastro");

    form.addEventListener("submit", (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const senha = document.getElementById("senha").value;
        const confirmar = document.getElementById("confirmarSenha").value;

        const regexemail = /^[a-zA-Z0-9._-]+@pucpr\.edu\.br$/;

        if (!regexemail.test(email)) {
            document.getElementById("msgEmail").innerText = "Email inválido!";
            return;
        } else {
            document.getElementById("msgEmail").innerText = "Email válido";
        }

        if (senha !== confirmar) {
            document.getElementById("msgConfirmar").innerText = "Senhas não coincidem!";
            return;
        }

        alert("Cadastro realizado (simulação)");
    });
</script>

</body>
</html>
