<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativar Autenticação em Dois Fatores - Nosso Serviço</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2 class="title">Ativar 2FA</h2>
            
            <div id="qr-container" style="text-align: center; margin: 20px 0;">
                <img id="qr-code" src="" alt="QR Code" style="max-width: 200px; border-radius: var(--radius);">
            </div>
            
            <div class="input-group">
                <label for="codigo">Código de Verificação</label>
                <input type="text" id="codigo" name="codigo" maxlength="6" placeholder="123456">
                <small style="color: var(--text-light); display: block; margin-top: 5px;">Digite o código do seu app de autenticação</small>
            </div>
            
            <button id="ativar-btn" class="btn btn-primary big" style="width: 100%;">Ativar 2FA</button>
            <div id="mensagem" style="margin-top: 15px; text-align: center; color: var(--text-light);"></div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
