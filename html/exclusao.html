<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Privacidade e Dados</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .dados-box {
      background: #f9f9f9; border: 1px solid #ddd; border-radius: 10px;
      padding: 15px; text-align: left; font-size: 14px; max-height: 300px;
      overflow-y: auto; margin-bottom: 20px; white-space: pre-wrap; color: #333;
    }
  </style>
</head>
<body>
  <script src="../js/script2.js"></script>
  <header class="header">
    <img src="../logo.jpeg" class="logo" alt="Logo">
    <div>
      <button class="btn btn-outline" onclick="window.location.href='index_cadastrado.html'">Voltar</button>
    </div>
  </header>

  <section class="section">
    <h1 class="title">Seus Dados no Sistema</h1>
    <p class="subtitle">Em conformidade com a LGPD, aqui estão todas as informações vinculadas à sua conta.</p>
  </section>

  <section class="container">
    <div class="form-container" style="max-width: 600px;">
      <div id="dados-view" class="dados-box">Carregando seus dados...</div>

      <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

      <h2 style="color:#ff5a5f;">Excluir Conta</h2>
      <p style="margin-bottom:15px; color:#777;">
        Para garantir a segurança da operação, você precisará confirmar sua identidade na próxima tela.
      </p>
      <button class="btn btn-primary" onclick="window.location.href='deletar-dados.html'" style="width: 100%;">
        Avançar para Exclusão
      </button>
    </div>
  </section>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('authToken');
      const box = document.getElementById('dados-view');
      if (!token) return;

      try {
        const response = await fetch(`../api/meus_dados.php?token=${encodeURIComponent(token)}`);
        const result = await response.json();
        if (result.success) {
          box.textContent = JSON.stringify(result.dados, null, 4);
        } else {
          box.textContent = "Erro ao carregar os dados: " + result.message;
        }
      } catch (error) {
        box.textContent = "Erro de conexão ao buscar os dados.";
      }
    });

    async function apagarViagem(viagemId) {
        if (!confirm('Tem certeza que deseja apagar esta viagem? Esta ação não pode ser desfeita.')) {
            return;
        }
      
        const token = localStorage.getItem('authToken');
      
        try {
            const envelope = await CriptoHibrida.montarEnvelope({ viagem_id: viagemId });

            const response = await fetch('../api/deletar_minha_viagem.php', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': token
                },
                body: JSON.stringify(envelope)
            });
          
            const data = await response.json();
          
            if (data.success) {
                alert('Viagem apagada com sucesso.');
                window.location.reload();
            } else {
                alert('Erro: ' + (data.message || 'Não foi possível apagar.'));
            }
        } catch (error) {
            alert('Erro de conexão.');
        }
    }
  </script>
<script src="../js/script.js"></script>
</body>
</html>
