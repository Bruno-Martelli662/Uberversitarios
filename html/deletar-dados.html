<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Exclusão</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<header class="header">
    <img src="../logo.jpeg" class="logo" alt="Uberversitários Logo">
</header>
<div class="container">
    <div class="form-container">
        <form action="../api/deletar.php" method="POST" onsubmit="return validarExclusao();">
            <h2 class="title" style="color: #ff5a5f;">Atenção: Exclusão Definitiva</h2>
            <p style="text-align: center; color: #777; margin-bottom: 20px;">
                Para apagar sua conta, confirme suas credenciais. Seus dados públicos serão apagados, e uma cópia isolada será mantida apenas para auditoria legal.
            </p>
            
            <div class="input-group">
                <label for="email">E-mail da Conta</label>
                <input type="email" id="email" name="email" required>
            </div>                
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary big" style="width: 100%; margin-bottom: 10px;">
                Confirmar Exclusão
            </button>
            <button type="button" class="btn btn-outline" style="width: 100%;" onclick="window.location.href='exclusao.html'">
                Cancelar
            </button>
        </form>
    </div>
</div>
<script>
    function validarExclusao() {
        return confirm("Tem certeza absoluta? Esta ação não pode ser desfeita e você perderá o acesso à plataforma.");
    }
</script>
</body>
</html>
