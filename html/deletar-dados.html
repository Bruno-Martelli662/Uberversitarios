<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Exclusão</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<header class="header">
    <img src="../logo.jpeg" class="logo" alt="Uberversitários Logo">
</header>
<div class="container">
    <div class="form-container">
        <form id="formDeletar">
            <h2 class="title" style="color: #ff5a5f;">Atenção: Exclusão Definitiva</h2>
            <p style="text-align: center; color: #777; margin-bottom: 20px;">
                Para apagar sua conta, confirme suas credenciais. Seus dados públicos serão apagados, e uma cópia isolada será mantida apenas para auditoria legal.
            </p>
            
            <div class="input-group">
                <label for="email">E-mail da Conta</label>
                <input type="email" id="email" name="email" required>
            </div>                
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" id="btnDeletar" class="btn btn-primary big" style="width: 100%; margin-bottom: 10px;">
                Confirmar Exclusão
            </button>
            <button type="button" class="btn btn-outline" style="width: 100%;" onclick="window.location.href='exclusao.html'">
                Cancelar
            </button>
        </form>
    </div>
</div>

<script>
    document.getElementById('formDeletar').addEventListener('submit', async function(e) {
        e.preventDefault(); // Impede a página de recarregar
        
        if (!confirm("Tem certeza absoluta? Esta ação não pode ser desfeita e você perderá o acesso à plataforma.")) {
            return;
        }

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('btnDeletar');
        const textoOriginal = btn.innerHTML;

        btn.innerHTML = 'Processando...';
        btn.disabled = true;

        try {
            const response = await fetch('../api/deletar.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            });
            
            const result = await response.json();

            if (result.success) {
                alert(result.message);
                // Limpa o token do armazenamento local (encerra a sessão no front-end)
                localStorage.removeItem('authToken');
                // Redireciona para a página inicial deslogada
                window.location.href = 'index.html';
            } else {
                alert("Erro: " + result.message);
            }
        } catch (error) {
            alert("Erro ao conectar com o servidor. Verifique sua conexão.");
            console.error(error);
        } finally {
            // Restaura o botão caso tenha dado erro
            btn.innerHTML = textoOriginal;
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
