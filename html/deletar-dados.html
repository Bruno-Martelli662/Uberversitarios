<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Exclusão</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .dados-box {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            font-size: 13px;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #333;
            font-family: monospace; /* Fonte monoespaçada para o JSON ficar bonito */
        }
    </style>
</head>
<body>
<header class="header">
    <img src="../logo.jpeg" class="logo" alt="Uberversitários Logo">
</header>
<div class="container">
    <div class="form-container" style="max-width: 600px;">
        <h2 class="title" style="color: #ff5a5f;">Atenção: Exclusão Definitiva</h2>
        <p style="text-align: center; color: #777; margin-bottom: 10px;">
            Em conformidade com a LGPD, abaixo estão todos os dados vinculados à sua conta. Seus dados públicos serão apagados e uma cópia será arquivada no cofre de segurança do sistema:
        </p>
        
        <div id="dados-view" class="dados-box">Carregando seus dados...</div>

        <form id="formDeletar">
            <p style="text-align: center; color: #333; margin-bottom: 15px; font-weight: 600;">
                Para confirmar a exclusão, digite suas credenciais:
            </p>

            <div class="input-group">
                <label for="email">E-mail da Conta</label>
                <input type="email" id="email" name="email" required>
            </div>                
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" id="btnDeletar" class="btn btn-primary big" style="width: 100%; margin-bottom: 10px;">
                Confirmar Exclusão
            </button>
            <button type="button" class="btn btn-outline" style="width: 100%;" onclick="window.location.href='index_cadastrado.html'">
                Cancelar
            </button>
        </form>
    </div>
</div>

<script>
    // 1. CARREGA OS DADOS ASSIM QUE A PÁGINA ABRE
    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('authToken');
        const box = document.getElementById('dados-view');
        
        if (!token) {
            box.textContent = "Sessão não encontrada. Faça login novamente para visualizar seus dados.";
            return;
        }

        try {
            // Chama a API que construímos antes para ler os dados do usuário e viagens
            const response = await fetch(`../api/meus_dados.php?token=${encodeURIComponent(token)}`);
            const result = await response.json();

            if (result.success) {
                // Formata o JSON com recuo (4 espaços) para ficar legível
                box.textContent = JSON.stringify(result.dados, null, 4);
            } else {
                box.textContent = "Erro ao carregar os dados: " + result.message;
            }
        } catch (error) {
            box.textContent = "Erro de conexão ao buscar os dados.";
        }
    });

    // 2. LIDA COM O BOTÃO DE EXCLUIR
    document.getElementById('formDeletar').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        
        if (!confirm("Tem certeza absoluta? Esta ação não pode ser desfeita e você perderá o acesso à plataforma.")) {
            return;
        }

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('btnDeletar');
        const textoOriginal = btn.innerHTML;

        btn.innerHTML = 'Processando...';
        btn.disabled = true;

        try {
            const response = await fetch('../api/deletar.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            });
            
            const result = await response.json();

            if (result.success) {
                alert(result.message);
                localStorage.removeItem('authToken'); // Desloga do front
                window.location.href = 'index.html'; // Volta para a tela principal
            } else {
                alert("Erro: " + result.message);
            }
        } catch (error) {
            alert("Erro ao conectar com o servidor. Verifique sua conexão.");
            console.error(error);
        } finally {
            btn.innerHTML = textoOriginal;
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
