<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Exclusão</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .dados-box {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            font-size: 13px;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #333;
            font-family: monospace; /* Fonte monoespaçada para o JSON ficar bonito */
        }
    </style>
</head>
<body>
<header class="header">
    <img src="../logo.jpeg" class="logo" alt="Uberversitários Logo">
</header>
<div class="container">
    <div class="form-container" style="max-width: 600px;">
        <h2 class="title" style="color: #ff5a5f;">Atenção: Exclusão Definitiva</h2>
        <p style="text-align: center; color: #777; margin-bottom: 10px;">
            Em conformidade com a LGPD, abaixo estão todos os dados vinculados à sua conta. Seus dados públicos serão apagados e uma cópia será arquivada no cofre de segurança do sistema:
        </p>
        
        <div id="dados-view" class="dados-box">Carregando seus dados...</div>

        <button type="button" id="btnBaixarDados" class="btn btn-outline" style="width: 100%; margin-bottom: 25px; display: none;" onclick="baixarDados()">
            📥 Baixar meus dados (JSON)
        </button>

        <form id="formDeletar">
            <p style="text-align: center; color: #333; margin-bottom: 15px; font-weight: 600;">
                Para confirmar a exclusão, digite suas credenciais:
            </p>

            <div class="input-group">
                <label for="email">E-mail da Conta</label>
                <input type="email" id="email" name="email" required>
            </div>                
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" id="btnDeletar" class="btn btn-primary big" style="width: 100%; margin-bottom: 10px;">
                Confirmar Exclusão
            </button>
            <button type="button" class="btn btn-outline" style="width: 100%;" onclick="window.location.href='index_cadastrado.html'">
                Cancelar
            </button>
        </form>
    </div>
</div>

<script>
    // 1. CARREGA OS DADOS ASSIM QUE A PÁGINA ABRE
    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('authToken');
        const box = document.getElementById('dados-view');
        const btnBaixar = document.getElementById('btnBaixarDados');
        
        if (!token) {
            box.textContent = "Sessão não encontrada. Faça login novamente para visualizar seus dados.";
            return;
        }

        try {
            // Chama a API para ler os dados do usuário e viagens
            const response = await fetch(`../api/meus_dados.php?token=${encodeURIComponent(token)}`);
            const result = await response.json();

            if (result.success) {
                // Formata o JSON com recuo (4 espaços) para ficar legível
                box.textContent = JSON.stringify(result.dados, null, 4);
                // Exibe o botão de download agora que os dados foram carregados
                btnBaixar.style.display = 'block';
            } else {
                box.textContent = "Erro ao carregar os dados: " + result.message;
            }
        } catch (error) {
            box.textContent = "Erro de conexão ao buscar os dados.";
        }
    });

    // 2. NOVA FUNÇÃO DE PORTABILIDADE (DOWNLOAD)
    function baixarDados() {
        const box = document.getElementById('dados-view');
        const conteudo = box.textContent;

        // Cria um objeto "Blob" (um arquivo em memória) com o conteúdo do JSON
        const blob = new Blob([conteudo], { type: 'application/json' });
        
        // Cria um link temporário para forçar o download do arquivo
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "meus_dados_uberversitarios.json"; // Nome do arquivo
        document.body.appendChild(a);
        a.click(); // Simula o clique do usuário
        document.body.removeChild(a); // Remove o link da tela
        window.URL.revokeObjectURL(url); // Libera a memória
    }

    // 3. LIDA COM O BOTÃO DE EXCLUIR
    document.getElementById('formDeletar').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        
        // Mensagem de confirmação atualizada com a justificativa de negócio/LGPD
        const mensagemConfirmacao = 
            "Tem certeza absoluta?\n\n" +
            "Devido à natureza da nossa plataforma de caronas universitárias, que exige identificação e rastreabilidade para garantir a segurança de todos os estudantes, estamos impossibilitados de realizar a exclusão apenas parcial dos seus dados para que você continue usando o site.\n\n" +
            "Ao prosseguir, sua conta será totalmente desativada, você perderá o acesso e as funções operacionais cessarão. Esta ação é irreversível.\n\n" +
            "Deseja confirmar a exclusão?";

        if (!confirm(mensagemConfirmacao)) {
            return;
        }

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('btnDeletar');
        const textoOriginal = btn.innerHTML;

        btn.innerHTML = 'Processando...';
        btn.disabled = true;

        try {
            const response = await fetch('../api/deletar.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            });
            
            const result = await response.json();

            if (result.success) {
                alert(result.message);
                localStorage.removeItem('authToken'); // Desloga do front
                window.location.href = 'index.html'; // Volta para a tela principal
            } else {
                alert("Erro: " + result.message);
            }
        } catch (error) {
            alert("Erro ao conectar com o servidor. Verifique sua conexão.");
            console.error(error);
        } finally {
            btn.innerHTML = textoOriginal;
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
