<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Nosso Serviço</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="../js/redireciona.js"></script>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <form id="registerForm">
                <h2 class="title">Criar uma conta</h2>
                
                <div class="input-group">
                    <label for="name">Nome de usuário</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="input-group">
                    <label for="tel">Número de telefone</label>
                    <input type="tel" id="tel" name="tel" placeholder="(XX)XXXXXXXXX" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="input-group">
                    <label for="confirm-password">Confirmar senha</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>
                
                <div class="checkbox-group">
                    <label class="checkbox-container">
                        <input type="checkbox" id="termsCheckbox" required>
                        <span class="checkmark"></span>
                        Eu li e aceito os 
                        <a href="Termo.html" target="_blank" class="terms-link">Termos e Serviços</a>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary big" style="width: 100%;">Cadastrar</button>
                
                <div style="text-align: center; margin-top: 20px;">
                    <p>Já tem uma conta? <a href="login.html" style="color: var(--primary);">Faça login</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
