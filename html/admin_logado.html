<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Administrador</title>

<link rel="stylesheet" href="../css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
.card-actions {
    margin-top: 15px;
    display: flex;
    gap: 10px;
    justify-content: center;
}
</style>
</head>

<body>

<script>
fetch('../api/admin-verificar-sessao.php', {
    credentials: 'same-origin'
})
.then(res => res.json())
.then(data => {
    if (!data.success || !data.admin) {
        window.location.href = 'admin-login.html';
    }
})
.catch(() => {
    window.location.href = 'admin-login.html';
});
</script>

<div class="container">
    <h2 class="title">Painel do Administrador</h2>

    <div style="text-align:center; margin-bottom:20px;">
        <button class="btn btn-outline" onclick="logoutAdmin()">Sair</button>
    </div>

    <div class="section">
        <h3>Usuários</h3>
        <div id="usuarios" class="cards"></div>
    </div>

    <div class="section">
        <h3>Viagens</h3>
        <div id="viagens" class="cards"></div>
    </div>
</div>

<script>
function escapar(texto) {
    return String(texto ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

async function carregarUsuarios() {
    const res = await fetch("../api/usuarios.php", {
        credentials: 'same-origin'
    });

    const usuarios = await res.json();

    const container = document.getElementById("usuarios");
    container.innerHTML = "";

    usuarios.forEach(u => {
        container.innerHTML += `
            <div class="card">
                <h4>${escapar(u.nome_usuario)}</h4>
                <p>${escapar(u.email)}</p>

                <div class="card-actions">
                    <button class="btn btn-outline small" onclick="banir(${Number(u.id)})">
                        Banir
                    </button>
                </div>
            </div>
        `;
    });
}

async function carregarViagens() {
    const res = await fetch("../api/viagens.php", {
        credentials: 'same-origin'
    });

    const viagens = await res.json();

    const container = document.getElementById("viagens");
    container.innerHTML = "";

    viagens.forEach(v => {
        container.innerHTML += `
            <div class="card">
                <h4>${escapar(v.origem)} → ${escapar(v.destino)}</h4>
                <p>Motorista: ${escapar(v.motorista_nome)}</p>

                <div class="card-actions">
                    <button class="btn btn-outline small" onclick="deletarViagem(${Number(v.id)})">
                        Apagar
                    </button>
                </div>
            </div>
        `;
    });
}

async function banir(id) {
    if (!confirm("Banir usuário?")) return;

    const res = await fetch(`../api/banir.php?id=${encodeURIComponent(id)}`, {
        credentials: 'same-origin'
    });

    const data = await res.json();

    if (data.status === "erro") {
        alert(data.message);
    } else {
        alert("Usuário banido!");
        carregarUsuarios();
        carregarViagens();
    }
}

async function deletarViagem(id) {
    if (!confirm("Apagar viagem?")) return;

    const res = await fetch(`../api/deletar_viagem.php?id=${encodeURIComponent(id)}`, {
        credentials: 'same-origin'
    });

    const data = await res.json();

    if (data.status === "erro") {
        alert(data.message);
    } else {
        alert("Viagem apagada!");
        carregarViagens();
    }
}

async function logoutAdmin() {
    await fetch('../api/admin-logout.php', {
        credentials: 'same-origin'
    });

    window.location.href = 'admin-login.html';
}

carregarUsuarios();
carregarViagens();
</script>

</body>
</html>
