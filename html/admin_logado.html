<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Administrador</title>

<link rel="stylesheet" href="../css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
.card-actions {
    margin-top: 15px;
    display: flex;
    gap: 10px;
    justify-content: center;
}
</style>

</head>

<body>

<div class="container">
    <h2 class="title">Painel do Administrador</h2>

```
<div class="section">
    <h3>Usuários</h3>
    <div id="usuarios" class="cards"></div>
</div>

<div class="section">
    <h3>Viagens</h3>
    <div id="viagens" class="cards"></div>
</div>
```

</div>

<script>
// ==========================
// USUÁRIOS
// ==========================
async function carregarUsuarios() {
    const res = await fetch("../api/usuarios.php");
    const usuarios = await res.json();

    const container = document.getElementById("usuarios");
    container.innerHTML = "";

    usuarios.forEach(u => {
        container.innerHTML += `
            <div class="card">
                <h4>${u.nome_usuario}</h4>
                <p>${u.email}</p>

                <div class="card-actions">
                    <button class="btn btn-outline small" onclick="banir(${u.id})">
                        Banir
                    </button>
                </div>
            </div>
        `;
    });
}

// ==========================
// VIAGENS
// ==========================
async function carregarViagens() {
    const res = await fetch("../api/viagens.php");
    const viagens = await res.json();

    const container = document.getElementById("viagens");
    container.innerHTML = "";

    viagens.forEach(v => {
        container.innerHTML += `
            <div class="card">
                <h4>${v.origem} → ${v.destino}</h4>
                <p>Motorista: ${v.motorista_nome}</p>

                <div class="card-actions">
                    <button class="btn btn-outline small" onclick="deletarViagem(${v.id})">
                        Apagar
                    </button>
                </div>
            </div>
        `;
    });
}

// ==========================
// BANIR
// ==========================
async function banir(id) {
    if (!confirm("Banir usuário?")) return;

    await fetch(`api/banir.php?id=${id}`);
    alert("Usuário banido!");

    carregarUsuarios();
    carregarViagens();
}

// ==========================
// DELETAR VIAGEM
// ==========================
async function deletarViagem(id) {
    if (!confirm("Apagar viagem?")) return;

    await fetch(`api/deletar_viagem.php?id=${id}`);
    alert("Viagem apagada!");

    carregarViagens();
}

// INIT
carregarUsuarios();
carregarViagens();
</script>

</body>
</html>
