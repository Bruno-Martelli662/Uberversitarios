<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Confirme seu e-mail</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    h1 { color: #333; }
    p { color: #666; }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      background: #4CAF50;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📧 Verifique seu e-mail</h1>
    <p>Enviamos um link de confirmação para você.</p>
    <p>Após confirmar, você será redirecionado automaticamente.</p>

    <button onclick="reenviarEmail()">Reenviar e-mail</button>
  </div>

  <script>
    function reenviarEmail() {
      fetch('/api/resend-email', { method: 'POST' })
        .then(() => alert('E-mail reenviado!'));
    }
  </script>
</body>
</html>
