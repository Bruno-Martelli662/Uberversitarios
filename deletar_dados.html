<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deletar dados do usuário</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            
            <form action="deletar.php" method="POST"
                  onsubmit="return confirm('⚠️ ATENÇÃO!\n\nTem certeza que deseja deletar sua conta?\nEssa ação é permanente e não pode ser desfeita!');">
                
                <h2 class="title">Deletar conta</h2>
                
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>                
                
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required>
                </div>                
                
                <button type="submit" class="btn btn-primary big" style="width: 100%;">
                    Deletar conta
                </button>

            </form>

        </div>
    </div>
</body>
</html>
