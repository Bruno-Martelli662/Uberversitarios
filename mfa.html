<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Autenticação em Duas Etapas</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
</head>
<body>
    <h1 class="header" id="header">Verificação de Segurança</h1>

    <form class="login100-form" id="formMFA">
        <span class="login100-form-title bookshell-fonte3 py-3">
            Autenticação em 2 Fatores
        </span>

        <!-- INSTRUÇÃO -->
        <div class="text-center p-b-20">
            <span class="fonte-1">
                Insira o código gerado pelo seu Authenticator
            </span>
        </div>

        <!-- CÓDIGO MFA -->
        <div class="container2 position-relative">
            <input class="input100 input-cadastro"
                   type="text"
                   id="codigo"
                   name="codigo"
                   placeholder="000000"
                   maxlength="6"
                   pattern="\d{6}"
                   required>

            <p id="codigo-mensagem" class="mensagem"></p>

            <span class="focus-input100"></span>

            <span class="symbol-input100">
                <i class="bi bi-shield-lock-fill icon pb-3"></i>
            </span>
        </div>

        <!-- BOTÃO -->
        <button class="login100-form-btn fonte-2"
                type="submit"
                style="color: white;"
                id="btnVerificar">
            Verificar
        </button>

        <!-- OPÇÕES -->
        <div class="text-center p-t-20">
            <span class="fonte-1">Não conseguiu acessar?</span>
            <a class="fonte-2" href="recuperarMFA.html">Recuperar acesso</a>
        </div>

        <div class="text-center p-t-136">
            <a class="fonte-3" href="login.html">
                Voltar para o login
                <i class="fa fa-long-arrow-right m-l-5" aria-hidden="true"></i>
            </a>
        </div>
    </form>
</body>
</html>
