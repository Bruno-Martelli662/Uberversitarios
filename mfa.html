<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Autenticação em Duas Etapas</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='style.css'>
    <script src='main.js'></script>
</head>
<body>

    <header class="header">
        <!-- logo ou nav podem entrar aqui futuramente -->
    </header>

    <div class="form-container">
        <h2>Autenticação em 2 Fatores</h2>

        <p style="text-align: center; color: var(--text-light); margin-bottom: 20px;">
            Insira o código gerado pelo seu Authenticator
        </p>

        <form id="formMFA" action="verificarMFA.php" method="POST">

            <!-- CÓDIGO MFA -->
            <div class="input-group">
                <input
                    type="text"
                    id="codigo"
                    name="codigo"
                    placeholder="000000"
                    maxlength="6"
                    pattern="\d{6}"
                    required>
                <p id="codigo-mensagem"></p>
            </div>

            <button class="btn btn-primary big" type="submit" id="btnVerificar">
                Verificar
            </button>

        </form>

        <div style="text-align: center; margin-top: 20px;">
            <span>Não conseguiu acessar?</span>
            <a href="recuperarMFA.html">Recuperar acesso</a>
        </div>

        <div style="text-align: center; margin-top: 15px;">
            <a href="login.html">
                ← Voltar para o login
            </a>
        </div>
    </div>

</body>
</html>
